<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إنشاء حساب - أوستاوي</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="auth.js"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode:"class",
    theme:{ extend:{
      colors:{
        "primary":"#031636","primary-container":"#1a2b4c","on-primary":"#ffffff","on-primary-container":"#8293ba",
        "secondary":"#9c4400","secondary-container":"#fd7613","on-secondary":"#ffffff","on-secondary-container":"#5b2500",
        "surface":"#f8f9ff","surface-bright":"#f8f9ff","surface-container":"#e5eeff","surface-container-low":"#eff4ff",
        "surface-container-lowest":"#ffffff","surface-container-high":"#dce9ff","surface-variant":"#d3e4fe",
        "on-surface":"#0b1c30","on-surface-variant":"#44474e","outline":"#75777f","outline-variant":"#c5c6cf",
        "error":"#ba1a1a","error-container":"#ffdad6","on-error":"#ffffff","on-error-container":"#93000a",
        "background":"#f8f9ff","on-background":"#0b1c30"
      },
      borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},
      spacing:{"xs":"4px","sm":"8px","md":"16px","lg":"24px","xl":"32px","2xl":"48px","gutter":"16px"},
    }}
  }
</script>
<style>
  body { font-family: 'Noto Sans Arabic', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface text-on-surface antialiased overflow-x-hidden">
<main class="min-h-screen flex flex-col md:flex-row-reverse">

<!-- Hero Side -->
<section class="hidden md:flex w-1/2 relative overflow-hidden items-center justify-center p-xl" style="background: linear-gradient(135deg, #031636 0%, #1a2b4c 50%, #0a2550 100%);">
  <div class="absolute inset-0 opacity-10">
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-white rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-orange-500 rounded-full blur-[100px]"></div>
  </div>
  <div class="relative z-10 flex flex-col items-center text-center">
    <div class="w-24 h-24 bg-orange-500 rounded-2xl flex items-center justify-center mb-lg shadow-2xl">
      <span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings:'FILL' 1;">handyman</span>
    </div>
    <h2 class="text-4xl font-black text-white mb-md">منصة أوستاوي</h2>
    <p class="text-white/80 text-lg max-w-sm leading-relaxed">وجهتك الأولى للوصول إلى أفضل الفنيين المعتمدين والخدمات المنزلية بكل سهولة وموثوقية.</p>
    <div class="mt-xl grid grid-cols-3 gap-md w-full max-w-xs">
      <div class="bg-white/10 rounded-xl p-md text-center backdrop-blur-sm">
        <p class="text-white font-black text-2xl">١٢K+</p>
        <p class="text-white/70 text-xs mt-1">فني مسجّل</p>
      </div>
      <div class="bg-white/10 rounded-xl p-md text-center backdrop-blur-sm">
        <p class="text-white font-black text-2xl">٤.٩</p>
        <p class="text-white/70 text-xs mt-1">تقييم متوسط</p>
      </div>
      <div class="bg-white/10 rounded-xl p-md text-center backdrop-blur-sm">
        <p class="text-white font-black text-2xl">٥٠K</p>
        <p class="text-white/70 text-xs mt-1">خدمة منجزة</p>
      </div>
    </div>
  </div>
</section>

<!-- Form Side -->
<section class="flex-1 flex items-center justify-center p-md md:p-2xl bg-white">
  <div class="w-full max-w-md">
    <header class="mb-xl text-right">
      <div class="md:hidden flex justify-center mb-lg">
        <div class="w-16 h-16 bg-orange-500 rounded-2xl flex items-center justify-center">
          <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1;">handyman</span>
        </div>
      </div>
      <h1 class="text-3xl font-black text-primary mb-xs">إنشاء حساب جديد</h1>
      <p class="text-outline text-base">انضم إلى مجتمع أوستاوي اليوم.</p>
    </header>

    <!-- Role Tabs -->
    <div class="flex p-1 bg-gray-100 rounded-xl mb-xl gap-1">
      <button onclick="setRole('client')" id="tab-client" class="flex-1 py-3 px-4 rounded-lg text-sm font-bold transition-all duration-200 bg-orange-500 text-white shadow-sm">
        <span class="material-symbols-outlined text-sm align-middle ml-1" style="font-variation-settings:'FILL' 1;">person</span>
        عميل
      </button>
      <button onclick="setRole('worker')" id="tab-worker" class="flex-1 py-3 px-4 rounded-lg text-sm font-bold transition-all duration-200 text-gray-500 hover:text-primary">
        <span class="material-symbols-outlined text-sm align-middle ml-1">engineering</span>
        فني / مزود خدمة
      </button>
    </div>

    <!-- Error -->
    <div id="errorMsg" class="hidden mb-md p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm font-semibold"></div>

    <!-- Form -->
    <div class="space-y-lg">
      <div class="space-y-xs">
        <label class="block text-sm font-bold text-on-surface" for="name">الاسم الكامل</label>
        <input class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition-all text-right text-base outline-none" id="name" placeholder="أدخل اسمك الثلاثي" type="text"/>
      </div>
      <div class="space-y-xs">
        <label class="block text-sm font-bold text-on-surface" for="email">البريد الإلكتروني</label>
        <input class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition-all text-left text-base outline-none" dir="ltr" id="email" placeholder="example@domain.com" type="email"/>
      </div>
      <div class="space-y-xs">
        <label class="block text-sm font-bold text-on-surface" for="phone">رقم الهاتف</label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-gray-400 text-base font-mono" dir="ltr">+966</span>
          <input class="w-full pl-16 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition-all text-left text-base outline-none" dir="ltr" id="phone" placeholder="5xxxxxxxx" type="tel"/>
        </div>
      </div>
      <div class="space-y-xs">
        <label class="block text-sm font-bold text-on-surface" for="password">كلمة المرور</label>
        <div class="relative">
          <input class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition-all text-left text-base outline-none" dir="ltr" id="password" placeholder="••••••••" type="password"/>
          <button onclick="togglePass()" class="absolute left-3 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-primary transition-colors" type="button">
            <span class="material-symbols-outlined" id="passIcon">visibility</span>
          </button>
        </div>
      </div>
      <div class="flex items-start gap-3">
        <input class="w-5 h-5 rounded border-gray-300 text-orange-500 focus:ring-orange-400 mt-0.5 accent-orange-500" id="terms" type="checkbox"/>
        <label class="text-sm text-gray-500" for="terms">
          أوافق على <a class="text-primary font-bold hover:underline" href="#">الشروط والأحكام</a> و<a class="text-primary font-bold hover:underline" href="#">سياسة الخصوصية</a>
        </label>
      </div>
      <button onclick="doRegister()" id="submitBtn" class="w-full bg-primary text-white py-4 rounded-xl font-bold text-base hover:bg-primary-container transition-all active:scale-[0.98] shadow-md flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-xl">person_add</span>
        إنشاء الحساب
      </button>
    </div>

    <!-- Divider -->
    <div class="relative my-xl">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
      <div class="relative flex justify-center"><span class="bg-white px-4 text-gray-400 text-sm">أو تابع باستخدام</span></div>
    </div>

    <!-- Social -->
    <div class="grid grid-cols-2 gap-md">
      <button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition-colors font-bold text-sm text-primary">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        جوجل
      </button>
      <button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition-colors font-bold text-sm text-primary">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">ios</span>
        أبل
      </button>
    </div>

    <footer class="mt-xl text-center">
      <p class="text-gray-500 text-base">لديك حساب بالفعل؟ <a class="text-primary font-black hover:underline mr-1" href="sign_in.html">تسجيل الدخول</a></p>
    </footer>
  </div>
</section>
</main>

<script>
  let currentRole = 'client';

  function setRole(role) {
    currentRole = role;
    const tc = document.getElementById('tab-client');
    const tw = document.getElementById('tab-worker');
    if (role === 'client') {
      tc.className = 'flex-1 py-3 px-4 rounded-lg text-sm font-bold transition-all duration-200 bg-orange-500 text-white shadow-sm';
      tw.className = 'flex-1 py-3 px-4 rounded-lg text-sm font-bold transition-all duration-200 text-gray-500 hover:text-primary';
    } else {
      tw.className = 'flex-1 py-3 px-4 rounded-lg text-sm font-bold transition-all duration-200 bg-orange-500 text-white shadow-sm';
      tc.className = 'flex-1 py-3 px-4 rounded-lg text-sm font-bold transition-all duration-200 text-gray-500 hover:text-primary';
    }
  }

  function togglePass() {
    const p = document.getElementById('password');
    const i = document.getElementById('passIcon');
    p.type = p.type === 'password' ? 'text' : 'password';
    i.textContent = p.type === 'password' ? 'visibility' : 'visibility_off';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 4000);
  }

  function doRegister() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const terms = document.getElementById('terms').checked;

    if (!name || !email || !phone || !password) return showError('يرجى ملء جميع الحقول');
    if (!terms) return showError('يجب الموافقة على الشروط والأحكام');
    if (password.length < 6) return showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل');

    const btn = document.getElementById('submitBtn');
    btn.textContent = 'جاري إنشاء الحساب...';
    btn.disabled = true;

    setTimeout(() => {
      const result = Auth.register(name, email, phone, password, currentRole);
      if (!result.ok) {
        btn.innerHTML = '<span class="material-symbols-outlined text-xl">person_add</span> إنشاء الحساب';
        btn.disabled = false;
        return showError(result.msg);
      }
      localStorage.setItem('ostawy_current_user', JSON.stringify(result.user));
      window.location.href = currentRole === 'worker' ? 'worker_dashbord.html' : 'home_page.html';
    }, 800);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const user = Auth.currentUser();
    if (user) window.location.href = user.role === 'worker' ? 'worker_dashbord.html' : 'home_page.html';
  });

  document.addEventListener('keydown', e => { if(e.key === 'Enter') doRegister(); });
</script>
</body></html>
