<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>الإشعارات - أوستاوي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="auth.js"></script>
<style>
  body { font-family: 'Noto Sans Arabic', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .notif-unread { border-right: 4px solid #fd7613; background: #fff8f3; }
  .notif-read { border-right: 4px solid transparent; background: white; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="sticky top-0 z-50 flex justify-between items-center px-4 md:px-8 h-16 bg-white shadow-sm border-b border-gray-100">
  <div class="flex items-center gap-3">
    <button onclick="history.back()" class="p-2 rounded-xl hover:bg-gray-100 transition-colors">
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
    <h1 class="font-black text-xl text-slate-900">الإشعارات</h1>
  </div>
  <button onclick="markAllRead()" class="text-sm font-bold text-orange-500 hover:text-orange-700 transition-colors px-3 py-1.5 rounded-xl hover:bg-orange-50">
    تحديد الكل كمقروء
  </button>
</header>

<main class="max-w-2xl mx-auto px-4 py-4 pb-24 md:pb-8 space-y-2" id="notifList">
</main>

<!-- Bottom Nav -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-16 bg-white shadow-[0_-4px_12px_rgba(0,0,0,0.05)] border-t border-gray-100">
  <a href="home_page.html" class="flex flex-col items-center justify-center text-gray-400">
    <span class="material-symbols-outlined">home</span><span class="text-[10px] font-bold mt-0.5">الرئيسية</span>
  </a>
  <a href="dicover.html" class="flex flex-col items-center justify-center text-gray-400">
    <span class="material-symbols-outlined">search</span><span class="text-[10px] font-bold mt-0.5">بحث</span>
  </a>
  <a href="map.html" class="flex flex-col items-center justify-center text-gray-400">
    <span class="material-symbols-outlined">map</span><span class="text-[10px] font-bold mt-0.5">الخريطة</span>
  </a>
  <a href="my_orders.html" class="flex flex-col items-center justify-center text-gray-400">
    <span class="material-symbols-outlined">calendar_today</span><span class="text-[10px] font-bold mt-0.5">حجوزاتي</span>
  </a>
  <a href="client_profile.html" class="flex flex-col items-center justify-center text-gray-400">
    <span class="material-symbols-outlined">person</span><span class="text-[10px] font-bold mt-0.5">حسابي</span>
  </a>
</nav>

<script>
const notifications = [
  { id:1, icon:'check_circle', iconBg:'bg-green-100', iconColor:'text-green-600', title:'تم قبول طلبك', body:'وافق الفني أحمد محمد على طلب إصلاح السباكة. سيصل في غضون ٣٠ دقيقة.', time:'منذ ٥ دقائق', unread:true, link:'my_orders.html' },
  { id:2, icon:'star', iconBg:'bg-yellow-100', iconColor:'text-yellow-500', title:'قيّم تجربتك', body:'هل أعجبك عمل الفني محمود خالد؟ شاركنا رأيك وساعد الآخرين في الاختيار.', time:'منذ ساعتين', unread:true, link:'rate.html' },
  { id:3, icon:'schedule', iconBg:'bg-blue-100', iconColor:'text-blue-600', title:'تذكير بموعدك', body:'لديك موعد صيانة مكيف مركزي غداً الساعة ١٠:٠٠ صباحاً مع الفني سامر علي.', time:'منذ ٣ ساعات', unread:true, link:'my_orders.html' },
  { id:4, icon:'local_offer', iconBg:'bg-orange-100', iconColor:'text-orange-500', title:'عرض خاص لك!', body:'احصل على خصم ٢٠٪ على خدمات الكهرباء هذا الأسبوع فقط. استخدم كود: OSTAWY20', time:'أمس', unread:false, link:'dicover.html' },
  { id:5, icon:'verified_user', iconBg:'bg-purple-100', iconColor:'text-purple-600', title:'حسابك موثق', body:'تم التحقق من حسابك بنجاح. يمكنك الآن الاستفادة من جميع ميزات المنصة.', time:'منذ ٣ أيام', unread:false, link:'client_profile.html' },
  { id:6, icon:'payment', iconBg:'bg-green-100', iconColor:'text-green-600', title:'تم الدفع بنجاح', body:'تم خصم ١٢٠ ر.س مقابل خدمة تركيب النقاط الكهربائية. شكراً لثقتك بأوستاوي.', time:'منذ أسبوع', unread:false, link:'my_orders.html' },
];

function renderNotifs(data) {
  const list = document.getElementById('notifList');
  list.innerHTML = '';
  if (!data.length) {
    list.innerHTML = `<div class="bg-white rounded-2xl p-12 text-center shadow-sm border border-gray-100">
      <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-gray-400 text-3xl">notifications_off</span>
      </div>
      <h3 class="font-bold text-slate-900 mb-2">لا توجد إشعارات</h3>
      <p class="text-sm text-gray-500">ستظهر إشعاراتك هنا عند وجودها</p>
    </div>`;
    return;
  }
  data.forEach((n, i) => {
    const el = document.createElement('a');
    el.href = n.link;
    el.className = `block rounded-2xl p-4 shadow-sm border border-gray-100 hover:shadow-md transition-all cursor-pointer ${n.unread ? 'notif-unread' : 'notif-read'}`;
    el.innerHTML = `
      <div class="flex items-start gap-4">
        <div class="w-11 h-11 rounded-2xl ${n.iconBg} flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined ${n.iconColor}" style="font-variation-settings:'FILL' 1;">${n.icon}</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <p class="font-bold text-slate-900 text-sm">${n.title}</p>
            ${n.unread ? '<div class="w-2 h-2 bg-orange-500 rounded-full flex-shrink-0 mt-1.5"></div>' : ''}
          </div>
          <p class="text-xs text-gray-500 mt-1 leading-relaxed">${n.body}</p>
          <p class="text-xs text-gray-400 mt-2 font-semibold">${n.time}</p>
        </div>
      </div>`;
    el.addEventListener('click', () => {
      notifications[i].unread = false;
      el.className = el.className.replace('notif-unread','notif-read');
      el.querySelector('.w-2.h-2')?.remove();
    });
    list.appendChild(el);
  });
}

function markAllRead() {
  notifications.forEach(n => n.unread = false);
  renderNotifs(notifications);
}

window.addEventListener('DOMContentLoaded', () => {
  Auth.requireAuth();
  renderNotifs(notifications);
});
</script>
</body></html>
